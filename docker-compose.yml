version: '3.8'

services:
  # БАЗА ДАННЫХ
  database:
    image: postgres:15-alpine
    container_name: tryneuro_db
    restart: always
    environment:
      POSTGRES_DB: tryneuro_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - tryneuro_network

  # БЭКЕНД (JAVA)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tryneuro_backend
    restart: always
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/tryneuro_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-postgres}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      JWT_SECRET: ${JWT_SECRET:-SecureKey1234567890}
    depends_on:
      - database
    networks:
      - tryneuro_network
    # Порт 8080 теперь только внутри сети Docker
    expose:
      - 8080

  # ФРОНТЕНД (SVELTE)
  frontend-svelte:
    build:
      context: ./frontend-svelte
      dockerfile: Dockerfile
    container_name: tryneuro_svelte
    restart: always
    environment:
      ORIGIN: https://${SVELTE_DOMAIN:-localhost}
      PORT: 3000
    depends_on:
      - backend
    networks:
      - tryneuro_network
    expose:
      - 3000

  # ДИСПЕТЧЕР (NGINX PROXY MANAGER)
  nginx-proxy:
    image: 'jc21/nginx-proxy-manager:latest'
    container_name: tryneuro_proxy
    restart: always
    ports:
      - '80:80'   # Публичный HTTP
      - '81:81'   # Админка прокси
      - '443:443' # Публичный HTTPS
    volumes:
      - ./proxy/data:/data
      - ./proxy/letsencrypt:/etc/letsencrypt
    networks:
      - tryneuro_network

networks:
  tryneuro_network:
    driver: bridge

volumes:
  postgres_data:
