version: '3.8'

services:
  database:
    image: postgres:15-alpine
    container_name: tryneuro_db
    restart: always
    environment:
      POSTGRES_DB: tryneuro_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - tryneuro_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tryneuro_backend
    restart: always
    environment:
      # Внутренний URL для Docker-сети
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/tryneuro_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-postgres}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      JWT_SECRET: ${JWT_SECRET:-SecureKey1234567890}
    depends_on:
      - database
    networks:
      - tryneuro_network
    # Пробрасываем порт для Nginx Proxy Manager
    ports:
      - "8080:8080"

  frontend-svelte:
    build:
      context: ./frontend-svelte
      dockerfile: Dockerfile
    container_name: tryneuro_svelte
    restart: always
    environment:
      # Здесь будет адрес вашего Mini App
      ORIGIN: https://${SVELTE_DOMAIN:-localhost}
      PORT: 3000
    depends_on:
      - backend
    networks:
      - tryneuro_network
    ports:
      - "3000:3000"

networks:
  tryneuro_network:
    driver: bridge

volumes:
  postgres_data:
