server:
  port: 8081

spring:
  application:
    name: notification-service
  threads:
    virtual:
      enabled: true

telegram:
  api-id: ${TELEGRAM_API_ID:0}
  api-hash: ${TELEGRAM_API_HASH:none}
  # Используем домашнюю папку пользователя в Linux, чтобы избежать проблем с /mnt/c
  sessions-path: ${user.home}/.try_neuro/tg-sessions

backend:
  url: ${BACKEND_SERVICE_URL:http://localhost:8080}

logging:
  level:
    root: INFO
    it.tdlight: WARN
