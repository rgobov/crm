<!DOCTYPE html>
<html>
<head>
  <base href="/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="999 CRM">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="999 CRM">
  
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>999 CRM</title>
  <link rel="manifest" href="manifest.json">

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <script>
    // Хак для принудительного вызова клавиатуры
    window.triggerMobileKeyboard = function() {
      var input = document.getElementById('hidden-telegram-input');
      if (input) {
        input.focus();
        input.click();
      }
    };

    // Слушатель тапов для проброса фокуса
    document.addEventListener('touchstart', function(e) {
      var target = e.target;
      while (target) {
        if (target.tagName === 'INPUT' || target.tagName === 'TEXTAREA' || target.contentEditable === 'true') {
          target.focus();
          break;
        }
        target = target.parentElement;
      }
    }, {passive: true});
  </script>

  <script src="flutter_bootstrap.js" async></script>
</head>
<body>
  <!-- СКРЫТЫЙ ИНПУТ ДЛЯ ВЫЗОВА КЛАВИАТУРЫ -->
  <input type="text" id="hidden-telegram-input"
         style="position: absolute; left: -9999px; opacity: 0; height: 1px; width: 1px;"
         autocapitalize="off" autocomplete="off" autocorrect="off" />
</body>
</html>
