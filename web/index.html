<!DOCTYPE html>
<html>
<head>
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="999 CRM">

  <!-- Улучшенный viewport для работы с клавиатурой -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="999 CRM">
  
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>999 CRM</title>
  <link rel="manifest" href="manifest.json">

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <script>
    // Этот скрипт помогает "пробросить" фокус от Flutter к системному браузеру
    document.addEventListener('touchstart', function(e) {
      // Ищем невидимые поля ввода, которые создает Flutter
      var target = e.target;
      while (target) {
        if (target.tagName === 'INPUT' || target.tagName === 'TEXTAREA' || target.contentEditable === 'true') {
          target.focus();
          break;
        }
        target = target.parentElement;
      }
    }, {passive: true});

    // Функция, которую мы можем вызвать из Flutter если ничего не помогает
    window.forceFocus = function() {
      var input = document.querySelector('input');
      if (input) input.focus();
    };
  </script>

  <script src="flutter_bootstrap.js" async></script>
</head>
<body>
</body>
</html>
