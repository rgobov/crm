events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # --- HTTP: Перенаправление на HTTPS ---
    server {
        listen 80;
        server_name 738629.cloud4box.ru;
        return 301 https://$host$request_uri;
    }

    # --- HTTPS: Основной сервер ---
    server {
        listen 443 ssl;
        server_name 738629.cloud4box.ru;

        # Пути к сертификатам Let's Encrypt ( Certbot положит их сюда )
        ssl_certificate     /etc/letsencrypt/live/738629.cloud4box.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/738629.cloud4box.ru/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # 1. Фронтенд (Flutter Web)
        location / {
            proxy_pass http://tryneuro_frontend:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # 2. Бэкенд (Java API)
        location /api/ {
            proxy_pass http://tryneuro_backend:8080/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # Поддержка WebSocket (STOMP)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # 3. ТУННЕЛЬ ДЛЯ РАЗРАБОТКИ (ВЕБХУКИ)
        # Запросы на https://738629.cloud4box.ru/dev-webhook/ пойдут в ваш SSH туннель (порт 9000)
        location /dev-webhook/ {
            proxy_pass http://host.docker.internal:9000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
