# Тестовый профиль для Spring Boot

# Настройки базы данных для тестов (H2 in-memory)
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.h2.console.enabled=true
spring.flyway.enabled=false

# JPA/Hibernate настройки
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Настройки безопасности
jwt.secret=test-secret-key-for-jwt-token-generation-and-validation
jwt.expiration=86400000

# Настройки сервера
server.port=8080
server.servlet.context-path=

# CORS настройки
spring.web.cors.allowed-origins=http://localhost:5173,http://localhost:3000
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

# Логирование
logging.level.com.tryneuro.backend=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG

# Отключаем ненужные компоненты для тестов
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration

# Internal API secret для тестов
internal.api.secret=test-secret-key

# Тестовые данные
app.test.admin.email=admin@test.com
app.test.admin.password=password
app.test.manager.email=manager@test.com
app.test.manager.password=password
app.test.employee.email=employee@test.com
app.test.employee.password=password
