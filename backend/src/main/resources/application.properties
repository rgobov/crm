spring.application.name=backend
server.port=8080
server.address=0.0.0.0

# ??????????? ? ??
# ???? ?????????? SPRING_DATASOURCE_URL ?? ?????? ? Easypanel, 
# ????? ?????????????? tryneuro_database (???????? ??? ?????? ???????)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://tryneuro_database:5432/tryneuro_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# ????????????
jwt.secret=${JWT_SECRET:TemporarySecretKeyForDevOnly1234567890_Secure_Key_Long_Enough}
jwt.expiration=604800000

# Telegram
telegram.bot.token=${TELEGRAM_BOT_TOKEN}
