spring.application.name=backend
server.port=8080
server.address=0.0.0.0

# ???? ??????
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/tryneuro_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.repair-on-migrate=true
spring.flyway.out-of-order=true

# ????????????
jwt.secret=${JWT_SECRET:TemporarySecretKeyForDevOnly1234567890_Secure_Key_Long_Enough}
jwt.expiration=604800000

# ?????? ??? ??????????? ??????????????
internal.api.secret=try-neuro-internal-secret-2026

# URL ???????????
services.notifications.url=${SERVICES_NOTIFICATIONS_URL:http://localhost:8081}

# Telegram
telegram.bot.token=${TELEGRAM_BOT_TOKEN:none}
