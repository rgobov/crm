spring.application.name=backend
server.port=8080
server.address=0.0.0.0

# Database Configuration
# ? Docker/Coolify ???????? SPRING_DATASOURCE_URL, ???????? ?????????? localhost:5433
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/tryneuro_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
# Flyway ????? ????? ?? ????? ????? ? ?? ??????, ? ?? ??????? (??? ????? ? ???)
spring.flyway.locations=classpath:db/migration,classpath:db/test_data

# JWT
# ?????? ??????? ?? ?????????, ???? ???????????? ????????? ??? ??????????
jwt.secret=${JWT_SECRET:TemporarySecretKeyForDevOnly1234567890_Secure_Key_Long_Enough}
jwt.expiration=604800000

# Telegram Mini App Configuration
telegram.bot.token=${TELEGRAM_BOT_TOKEN}
