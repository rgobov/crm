spring.application.name=backend
server.port=8080
server.address=0.0.0.0

# ??
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://tryneuro_database:5432/tryneuro_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.repair-on-migrate=true
spring.flyway.validate-on-migrate=false
spring.flyway.out-of-order=true

# Jackson
spring.jackson.property-naming-strategy=LOWER_CAMEL_CASE
spring.jackson.serialization.write-dates-as-timestamps=false

# JWT
jwt.secret=${JWT_SECRET:TemporarySecretKeyForDevOnly1234567890_Secure_Key_Long_Enough}
jwt.expiration=604800000

# Secret
internal.api.secret=try-neuro-internal-secret-2026

# Notifications
services.notifications.url=${SERVICES_NOTIFICATIONS_URL:http://notifications:8081}

# Telegram
telegram.bot.token=${TELEGRAM_BOT_TOKEN:none}

# CORS
app.cors.origins=https://crm.999crm.ru

# ?????? ??? ???????? ???? (?? 10 ??)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
