version: '3.8'

services:
  frontend:
    image: roma1975/try_neuro_frontend:1.0.11
    container_name: tryneuro_frontend

  backend:
    image: roma1975/try_neuro_backend:1.0.0
    container_name: tryneuro_backend
    depends_on:
      - postgres
      - notifications
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/tryneuro_db
      - SPRING_DATASOURCE_USERNAME=postgres
      # Переменные будут подставлены из файла .env в этой же папке
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - JWT_SECRET=${JWT_SECRET}
      - SERVICES_NOTIFICATIONS_URL=http://notifications:8081

  postgres:
    image: postgres:15-alpine
    container_name: tryneuro_db_prod
    environment:
      POSTGRES_DB: tryneuro_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data

  notifications:
    image: roma1975/try_neuro_notifications_python:1.0.0
    container_name: tryneuro_notifications_python
    environment:
      - TELEGRAM_API_ID=${TELEGRAM_API_ID}
      - TELEGRAM_API_HASH=${TELEGRAM_API_HASH}
      - BACKEND_URL=http://backend:8080
      - INTERNAL_SECRET=${INTERNAL_SECRET:-try-neuro-internal-secret-2026}
      - TELEGRAM_PROXY=${TELEGRAM_PROXY:-}
    volumes:
      - tg_sessions_python:/app/sessions
    restart: always

  nginx:
    image: nginx:alpine
    container_name: tryneuro_proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - frontend
      - backend
      - notifications
    restart: always

volumes:
  postgres_prod_data:
  tg_sessions_python:
