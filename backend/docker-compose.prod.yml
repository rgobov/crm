version: '3.8'

services:
  # --- FRONTEND (Flutter Web) ---
  frontend:
    image: roma1975/try_neuro_frontend:latest
    container_name: tryneuro_frontend
    # Мы не открываем порты наружу, так как Nginx-прокси будет раздавать сайт

  # --- BACKEND (Java/Spring Boot) ---
  backend:
    image: roma1975/try_neuro_backend:latest
    container_name: tryneuro_backend
    depends_on:
      - postgres
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/tryneuro_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: k918ddBi10e8_db_pass_secure

  # --- БАЗА ДАННЫХ ---
  postgres:
    image: postgres:15-alpine
    container_name: tryneuro_db_prod
    environment:
      POSTGRES_DB: tryneuro_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: k918ddBi10e8_db_pass_secure
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data

  # --- NGINX ПРОКСИ ---
  nginx:
    image: nginx:alpine
    container_name: tryneuro_proxy
    ports:
      - "80:80" # Открываем главный HTTP порт наружу
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro # Подключаем наш конфиг
    depends_on:
      - frontend
      - backend
    restart: always

volumes:
  postgres_prod_data:
