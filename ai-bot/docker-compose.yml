services:
  spring-ai-bot:
    container_name: tryneuro_spring_ai_bot
    build:
      context: .
      args:
        - BUILD_PROXY=${TELEGRAM_PROXY:-}
    ports:
      - "8082:8082"
    env_file: .env
    networks:
      - tryneuro_network
    volumes:
      - /opt/whisper-host:/opt/whisper:ro

  llm-server:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: tryneuro_llm_server
    ports:
      - "8083:8083"
    volumes:
      - /opt/llm-models:/models:ro
    command: -m /models/qwen-1.5b-q4.gguf -ngl 0 -c 4096 --host 0.0.0.0 --port 8083
    networks:
      - tryneuro_network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.5'
    healthcheck:
      test: curl -f http://localhost:8083/health || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  tryneuro_network:
    external: true
