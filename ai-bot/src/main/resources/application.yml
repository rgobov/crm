server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://tryneuro_database:5432/tryneuro_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
  ai:
    retry:
      max-attempts: 3
      backoff:
        initial-interval: 2s
        multiplier: 2
      on-http-codes: 429,500,502,503
      exclude-on-http-codes: 401,403

logging:
  level:
    com.tryneuro: DEBUG
    org.springframework.ai: DEBUG
    org.springframework.web.client: TRACE
