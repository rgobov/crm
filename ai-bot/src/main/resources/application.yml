server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://tryneuro_database:5432/tryneuro_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5

logging:
  level:
    com.tryneuro: INFO
    com.tryneuro.aibot.service.UserConfigService: DEBUG
