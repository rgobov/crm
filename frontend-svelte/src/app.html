<!DOCTYPE html>
<html lang="ru">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<link rel="manifest" href="/manifest.json" />
		
		<!-- iOS PWA icons & configuration -->
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<meta name="apple-mobile-web-app-title" content="999 CRM" />
		<link rel="apple-touch-icon" href="/icon-192x192.png" />
		<link rel="apple-touch-icon" sizes="192x192" href="/icon-192x192.png" />
		<link rel="apple-touch-icon" sizes="512x512" href="/icon-512x512.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />

		<!-- Telegram SDK (Local Copy for instant loading in RF) -->
		<script src="/js/telegram-web-app.js"></script>

		<!-- Capture PWA Installation intention and event early -->
		<script>
			(function() {
				console.log('[PWA TEST] URL on load:', window.location.href);
				const params = new URLSearchParams(window.location.search);
				console.log('[PWA TEST] action param is:', params.get('action'));
				if (params.get('action') === 'install') {
					try {
						sessionStorage.setItem('pwa-trigger-install', 'true');
						console.log('[PWA TEST] Set pwa-trigger-install to sessionStorage');
					} catch (e) {
						console.error('sessionStorage is not available', e);
					}
				}

				// Перехватываем событие до того, как Svelte закончит загрузку
				window.addEventListener('beforeinstallprompt', (e) => {
					e.preventDefault();
					window.deferredPrompt = e;
					console.log('[PWA TEST] beforeinstallprompt event captured');
					// Оповещаем Svelte, если компонент уже смонтирован
					window.dispatchEvent(new CustomEvent('pwa-prompt-ready'));
				});
			})();
		</script>

		<!-- Service Worker Registration -->
		<script>
			if ('serviceWorker' in navigator) {
				navigator.serviceWorker.register('/sw.js')
					.then(reg => {
						console.log('SW registered');
						
						// Если есть ожидающий обновления воркер, посылаем сигнал
						if (reg.waiting) {
							reg.waiting.postMessage({ type: 'SKIP_WAITING' });
						}

						// Отслеживаем новые версии воркера
						reg.addEventListener('updatefound', () => {
							const newWorker = reg.installing;
							newWorker.addEventListener('statechange', () => {
								if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
									newWorker.postMessage({ type: 'SKIP_WAITING' });
								}
							});
						});
					})
					.catch(error => console.log('SW registration failed'));

				// Мягко перезагружаем страницу при активации новой версии
				let refreshing = false;
				navigator.serviceWorker.addEventListener('controllerchange', () => {
					if (!refreshing) {
						refreshing = true;
						window.location.reload();
					}
				});
			}
		</script>

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
