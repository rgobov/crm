<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Офлайн режим - 999 CRM</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #fdf6e3;
            color: #586e75;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .offline-container {
            text-align: center;
            max-width: 400px;
            padding: 40px 20px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        .icon {
            font-size: 64px;
            margin-bottom: 20px;
        }
        h1 {
            color: #268bd2;
            margin-bottom: 16px;
        }
        p {
            color: #93a1a1;
            line-height: 1.6;
            margin-bottom: 24px;
        }
        .btn {
            background: #268bd2;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.3s;
        }
        .btn:hover {
            background: #2aa198;
        }
    </style>
</head>
<body>
    <div class="offline-container">
        <div class="icon">⭐</div>
        <h1>Офлайн режим</h1>
        <p>Вы сейчас не подключены к интернету. Некоторые функции могут быть недоступны. Пожалуйста, проверьте подключение и попробуйте снова.</p>
        <button class="btn" onclick="window.location.reload()">Обновить страницу</button>
    </div>
</body>
</html>
