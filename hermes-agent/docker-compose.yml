x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "100m"
    max-file: "3"

services:
  mcp-crm:
    build:
      context: ./mcp-crm
      dockerfile: Dockerfile
    container_name: tryneuro_mcp_crm
    restart: always
    logging: *default-logging
    environment:
      CRM_BACKEND_URL: ${CRM_BACKEND_URL:-http://backend:8080}
      INTERNAL_SECRET: ${INTERNAL_SECRET:-try-neuro-internal-secret-2026}
      AI_KNOWLEDGE_URL: http://ai-knowledge-service:8082
      HTTP_PROXY: ${TELEGRAM_PROXY}
      HTTPS_PROXY: ${TELEGRAM_PROXY}
      NO_PROXY: "localhost,127.0.0.1,backend,ai-knowledge-service,tryneuro_database,tryneuro_db"
    networks:
      - tryneuro_network

  hermes-agent:
    image: nousresearch/hermes-agent:latest
    container_name: tryneuro_hermes
    restart: always
    logging: *default-logging
    command: >
      sh -c "
        echo 'TELEGRAM_PROXY=${TELEGRAM_PROXY}' > /opt/data/.env &&
        echo 'HTTP_PROXY=${TELEGRAM_PROXY}' >> /opt/data/.env &&
        echo 'HTTPS_PROXY=${TELEGRAM_PROXY}' >> /opt/data/.env &&
        echo 'NO_PROXY=localhost,127.0.0.1,backend,mcp-crm,ai-knowledge-service,tryneuro_database,tryneuro_db' >> /opt/data/.env &&
        hermes config set model.provider custom &&
        hermes config set model.base_url http://mcp-crm:8001/v1 &&
        hermes config set model.api_key dummy &&
        hermes config set model.model openrouter/auto &&
        exec hermes gateway run
      "
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_PROXY: ${TELEGRAM_PROXY}
      GATEWAY_ALLOW_ALL_USERS: "true"
      HERMES_MCP_SERVERS: '{"crm":{"transport":"streamable-http","url":"http://mcp-crm:8000/mcp"}}'
      HTTP_PROXY: ${TELEGRAM_PROXY}
      HTTPS_PROXY: ${TELEGRAM_PROXY}
      NO_PROXY: "localhost,127.0.0.1,backend,mcp-crm,ai-knowledge-service,tryneuro_database,tryneuro_db"
    volumes:
      - hermes_data:/opt/data
    networks:
      - tryneuro_network
    ports:
      - "8083:8083"
    depends_on:
      - mcp-crm
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  watchtower:
    image: containrrr/watchtower
    container_name: tryneuro_watchtower_hermes
    restart: always
    logging: *default-logging
    environment:
      WATCHTOWER_SCHEDULE: "0 3 * * *"
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_INCLUDE_RESTARTING: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - tryneuro_network

networks:
  tryneuro_network:
    external: true

volumes:
  hermes_data:
