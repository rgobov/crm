x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "100m"
    max-file: "3"

services:
  mcp-crm:
    build:
      context: ./mcp-crm
      dockerfile: Dockerfile
    container_name: tryneuro_mcp_crm
    restart: always
    logging: *default-logging
    environment:
      CRM_BACKEND_URL: ${CRM_BACKEND_URL:-http://backend:8080}
      INTERNAL_SECRET: ${INTERNAL_SECRET:-try-neuro-internal-secret-2026}
      HTTP_PROXY: ${TELEGRAM_PROXY}
      HTTPS_PROXY: ${TELEGRAM_PROXY}
      NO_PROXY: "localhost,127.0.0.1,backend,tryneuro_database"
    networks:
      - tryneuro_network

  openclaw-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tryneuro_openclaw
    restart: always
    logging: *default-logging
    environment:
      DATABASE_URL: ${DATABASE_URL}
      BOT_TOKEN_1: ${BOT_TOKEN_1}
      BOT_TOKEN_2: ${BOT_TOKEN_2}
      BOT_TOKEN_3: ${BOT_TOKEN_3}
      BOT_TOKEN_4: ${BOT_TOKEN_4}
      TELEGRAM_PROXY: ${TELEGRAM_PROXY}
    volumes:
      - openclaw_data:/home/node/.openclaw
      - ./openclaw.json:/home/node/.openclaw/openclaw.json:ro
      - ./extensions:/app/extensions:ro
    networks:
      - tryneuro_network
    ports:
      - "8083:8083"
    depends_on:
      - mcp-crm
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  watchtower:
    image: containrrr/watchtower
    container_name: tryneuro_watchtower_openclaw
    restart: always
    logging: *default-logging
    environment:
      WATCHTOWER_SCHEDULE: "0 3 * * *"
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_INCLUDE_RESTARTING: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - tryneuro_network

networks:
  tryneuro_network:
    external: true

volumes:
  openclaw_data: