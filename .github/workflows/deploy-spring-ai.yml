name: Deploy Spring AI Bot

on:
  push:
    branches:
      - feature/spring-ai
    paths:
      - 'ai-bot/**'
      - '.github/workflows/deploy-spring-ai.yml'
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy-spring-ai:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          command_timeout: 30m
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e

            echo "--- SWITCHING TO BRANCH ${{ github.ref_name }} ---"
            cd ~/crm
            git fetch origin ${{ github.ref_name }}
            git checkout ${{ github.ref_name }} || git checkout -b ${{ github.ref_name }} origin/${{ github.ref_name }}
            git reset --hard origin/${{ github.ref_name }}
            cd ai-bot

            echo "--- CREATING .env FILE ---"
            cat > .env << EOF
            BOT_TOKEN_1=${{ secrets.BOT_TOKEN_1 }}
            BOT_TOKEN_2=${{ secrets.BOT_TOKEN_2 }}
            BOT_TOKEN_3=${{ secrets.BOT_TOKEN_3 }}
            BOT_TOKEN_4=${{ secrets.BOT_TOKEN_4 }}
            TELEGRAM_PROXY=${{ secrets.TELEGRAM_PROXY }}
            INTERNAL_SECRET=${{ secrets.INTERNAL_SECRET }}
            CRM_BACKEND_URL=${{ secrets.CRM_BACKEND_URL }}
            SPRING_DATASOURCE_URL=jdbc:postgresql://tryneuro_db:5432/tryneuro_db
            SPRING_DATASOURCE_USERNAME=postgres
            SPRING_DATASOURCE_PASSWORD=${{ secrets.DB_PASSWORD }}
            GIGACHAT_SCOPE=GIGACHAT_API_PERS
            LLM_LOCAL_URL=http://llm-server:8083
            EOF

            echo "--- FORCE REMOVE STALE CONTAINERS ---"
            docker rm -f tryneuro_spring_ai_bot 2>/dev/null || true
            docker rm -f tryneuro_bot_agent tryneuro_mcp_crm 2>/dev/null || true

            echo "--- BUILDING AND STARTING ---"
            export DOCKER_BUILDKIT=1
            docker network create tryneuro_network || true
            docker-compose up -d --build

            echo "--- CLEANUP ---"
            docker image prune --filter "until=24h" -f

            echo "--- STATUS ---"
            docker-compose ps

            echo "--- WAITING FOR BOT STARTUP ---"
            sleep 10

            echo "--- BOT LOGS ---"
            docker logs tryneuro_spring_ai_bot --tail 50
