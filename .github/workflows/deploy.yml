name: Deploy to VPS

on:
  push:
    branches:
      - feature/telegram-mini-app

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/crm
            
            echo "--- СИНХРОНИЗАЦИЯ КОДА ---"
            git fetch origin feature/telegram-mini-app
            git reset --hard origin/feature/telegram-mini-app
            
            echo "--- ВКЛЮЧЕНИЕ BUILDKIT ---"
            # Эти переменные критически важны для работы сборки Maven/npm
            export DOCKER_BUILDKIT=1
            export COMPOSE_DOCKER_CLI_BUILD=1
            
            echo "--- ОСТАНОВКА ПРИЛОЖЕНИЯ ---"
            docker-compose stop backend frontend-svelte
            docker-compose rm -f backend frontend-svelte
            
            echo "--- ПОЛНАЯ ПЕРЕСБОРКА (BUILDKIT ENABLED) ---"
            # Флаг --no-cache гарантирует чистую сборку без старых слоев
            docker-compose build --no-cache backend frontend-svelte
            
            echo "--- ЗАПУСК ---"
            docker-compose up -d
            
            echo "--- ПРОВЕРКА СТАТУСА ---"
            docker-compose ps
            
            echo "--- ЛОГИ (ПОСЛЕДНИЕ 50 СТРОК) ---"
            docker-compose logs --tail=50 backend
            
            echo "--- ОЧИСТКА ---"
            docker image prune -f
