name: Deploy to VPS

on:
  push:
    branches:
      - feature/notifications-service # Деплоим при пуше в текущую ветку

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd ~/crm
            
            echo "--- ОБНОВЛЕНИЕ КОДА ---"
            # Переключаемся на нужную ветку и подтягиваем изменения
            git fetch origin feature/notifications-service
            git reset --hard origin/feature/notifications-service
            
            echo "--- ПОДГОТОВКА СРЕДЫ (СЕКРЕТЫ) ---"
            # Создаем .env файл только с теми секретами, которые есть в GitHub
            echo "TELEGRAM_API_ID=${{ secrets.TELEGRAM_API_ID }}" > .env
            echo "TELEGRAM_API_HASH=${{ secrets.TELEGRAM_API_HASH }}" >> .env
            
            echo "--- СБОРКА КОНТЕЙНЕРОВ (BuildKit) ---"
            export DOCKER_BUILDKIT=1
            docker-compose build --pull
            
            echo "--- ПЕРЕЗАПУСК СЕРВИСОВ ---"
            docker-compose up -d --force-recreate
            
            echo "--- ОЧИСТКА МУСОРА ---"
            docker image prune -f
            
            echo "--- СТАТУС КОНТЕЙНЕРОВ ---"
            docker-compose ps
