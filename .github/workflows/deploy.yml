name: Deploy to VPS (FINAL ATTEMPT)

on:
  push:
    branches:
      - fix/ios-final-attempt

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd ~/crm

            echo "--- ПЕРЕКЛЮЧЕНИЕ НА ВЕТКУ ${{ github.ref_name }} ---"
            git fetch origin ${{ github.ref_name }}
            git checkout ${{ github.ref_name }} || git checkout -b ${{ github.ref_name }} origin/${{ github.ref_name }}
            git reset --hard origin/${{ github.ref_name }}

            echo "--- СОЗДАНИЕ .env ФАЙЛА ---"
            cd backend
            cat > .env << EOF
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            TELEGRAM_API_ID=${{ secrets.TELEGRAM_API_ID }}
            TELEGRAM_API_HASH=${{ secrets.TELEGRAM_API_HASH }}
            INTERNAL_SECRET=${{ secrets.INTERNAL_SECRET }}
            TELEGRAM_PROXY=${{ secrets.TELEGRAM_PROXY }}
            EOF

            echo "--- СБОРКА ОБРАЗОВ ---"
            export DOCKER_BUILDKIT=1
            docker-compose -f docker-compose.prod.yml build --no-cache

            echo "--- ОСТАНОВКА И УДАЛЕНИЕ СТАРЫХ КОНТЕЙНЕРОВ ---"
            docker-compose -f docker-compose.prod.yml down --remove-orphans
            # Принудительно удаляем все контейнеры проекта по их именам, чтобы избежать конфликтов
            docker rm -f tryneuro_backend tryneuro_notifications_python tryneuro_frontend tryneuro_db_prod tryneuro_proxy || true

            echo "--- ПЕРЕЗАПУСК ---"
            docker-compose -f docker-compose.prod.yml up -d

            echo "--- ОЧИСТКА СТАРЫХ КОНТЕЙНЕРОВ И ОБРАЗОВ ---"
            docker system prune -af

            echo "--- СТАТУС ---"
            docker-compose -f docker-compose.prod.yml ps
