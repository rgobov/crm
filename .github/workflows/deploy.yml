name: Deploy to VPS

on:
  push:
    branches:
      - feature/notifications-service

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd ~/crm
            
            echo "--- ОБНОВЛЕНИЕ КОДА ---"
            git fetch origin feature/notifications-service
            git reset --hard origin/feature/notifications-service
            
            echo "--- ПОДГОТОВКА СРЕДЫ ---"
            export DOCKER_BUILDKIT=1
            export COMPOSE_DOCKER_CLI_BUILD=1
            
            # Передаем секреты из GitHub в переменные сервера
            export TELEGRAM_API_ID="${{ secrets.TELEGRAM_API_ID }}"
            export TELEGRAM_API_HASH="${{ secrets.TELEGRAM_API_HASH }}"
            
            echo "--- ОСТАНОВКА И СБОРКА ---"
            docker-compose build --no-cache --pull
            
            echo "--- ЗАПУСК ОБНОВЛЕННОЙ ВЕРСИИ ---"
            TELEGRAM_API_ID=$TELEGRAM_API_ID TELEGRAM_API_HASH=$TELEGRAM_API_HASH docker-compose up -d --force-recreate
            
            echo "--- ОЧИСТКА МУСОРА ---"
            docker image prune -f
            
            echo "--- ПРОВЕРКА СТАТУСА ---"
            docker-compose ps
