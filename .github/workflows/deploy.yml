name: Deploy to VPS

on:
  push:
    branches:
      - feature/telegram-mini-app

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd ~/crm
            
            echo "--- ОБНОВЛЕНИЕ КОДА ---"
            git fetch origin feature/telegram-mini-app
            git reset --hard origin/feature/telegram-mini-app
            
            echo "--- ПОДГОТОВКА СРЕДЫ ---"
            export DOCKER_BUILDKIT=1
            export COMPOSE_DOCKER_CLI_BUILD=1
            
            echo "--- ОСТАНОВКА ТОЛЬКО ПРИЛОЖЕНИЯ ---"
            # Мы не трогаем прокси и базу без нужды
            docker-compose stop backend frontend-svelte || true
            docker-compose rm -f backend frontend-svelte || true
            
            echo "--- ЧИСТАЯ СБОРКА С НУЛЯ (БЕЗ КЭША) ---"
            # Флаг --pull проверяет свежесть базовых образов
            docker-compose build --no-cache --pull backend frontend-svelte
            
            echo "--- ЗАПУСК ОБНОВЛЕННОЙ ВЕРСИИ ---"
            docker-compose up -d --force-recreate
            
            echo "--- ОЧИСТКА МУСОРА ---"
            docker image prune -f
            
            echo "--- ПРОВЕРКА СТАТУСА ---"
            docker-compose ps
