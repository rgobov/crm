name: Deploy to VPS

on:
  push:
    branches:
      - feature/telegram-mini-app

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/crm
            git pull origin feature/telegram-mini-app
            
            # 1. Останавливаем текущие контейнеры
            docker-compose down
            
            # 2. Удаляем старые образы проекта, чтобы гарантировать чистоту
            docker images -q "crm-*" | xargs -r docker rmi -f
            
            # 3. Полная пересборка без кэша
            docker-compose build --no-cache
            
            # 4. Запуск с нуля
            docker-compose up -d
            
            # 5. Очистка мусора
            docker system prune -f
