name: Deploy to VPS

on:
  push:
    branches:
      - feature/telegram-mini-app

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/crm
            git pull origin feature/telegram-mini-app
            # ОПТИМИЗАЦИЯ: Убираем принудительный --build. 
            # Docker сам решит, что нужно пересобрать на основе изменившихся файлов.
            docker-compose up -d
