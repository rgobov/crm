name: Deploy to VPS

on:
  push:
    branches:
      - feature/telegram-mini-app

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/crm
            
            echo "--- ОБНОВЛЕНИЕ КОДА ---"
            git fetch origin feature/telegram-mini-app
            git reset --hard origin/feature/telegram-mini-app
            
            echo "--- ОСТАНОВКА ТОЛЬКО ПРИЛОЖЕНИЯ (БЕЗ БД И ПРОКСИ) ---"
            # Мы не трогаем базу и прокси, чтобы не терять соединение и данные
            docker-compose stop backend frontend-svelte
            docker-compose rm -f backend frontend-svelte
            
            echo "--- ПОЛНАЯ ПЕРЕСБОРКА БЕЗ КЭША ---"
            # Собираем только наши сервисы с нуля
            docker-compose build --no-cache backend frontend-svelte
            
            echo "--- ЗАПУСК ОБНОВЛЕННОЙ ВЕРСИИ ---"
            docker-compose up -d
            
            echo "--- ПРОВЕРКА ЗАПУСКА (СТАТУС) ---"
            docker-compose ps
            
            echo "--- ЛОГИ БЭКЕНДА (ПОСЛЕДНИЕ 50 СТРОК) ---"
            docker-compose logs --tail=50 backend
            
            echo "--- ОЧИСТКА ВРЕМЕННЫХ СЛОЕВ ---"
            docker image prune -f
