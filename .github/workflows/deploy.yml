name: Deploy to VPS (FINAL ATTEMPT)

on:
  push:
    branches:
      - fix/ios-final-attempt # Деплоим при пуше в эту новую ветку

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd ~/crm
            
            echo "--- ПЕРЕКЛЮЧЕНИЕ НА НОВУЮ ВЕТКУ ---"
            git fetch origin fix/ios-final-attempt
            git checkout fix/ios-final-attempt || git checkout -b fix/ios-final-attempt origin/fix/ios-final-attempt
            git reset --hard origin/fix/ios-final-attempt
            
            echo "--- СБОРКА ВСЕХ СЕРВИСОВ (БЕЗ КЭША) ---"
            export DOCKER_BUILDKIT=1
            docker-compose build --no-cache frontend-svelte
            docker-compose build --no-cache backend
            docker-compose build --no-cache notifications
            
            echo "--- ПЕРЕЗАПУСК ---"
            docker-compose up -d --force-recreate
            
            echo "--- СТАТУС ---"
            docker-compose ps
