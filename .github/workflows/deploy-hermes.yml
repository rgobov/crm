name: Deploy Hermes AI

on:
  push:
    branches:
      - fix/ios-final-attempt
      - feature/roles
    paths:
      - 'hermes-agent/**'

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy-hermes:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          command_timeout: 30m
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd ~/crm/hermes-agent

            echo "--- ПЕРЕКЛЮЧЕНИЕ НА ВЕТКУ ${{ github.ref_name }} ---"
            cd ~/crm
            git fetch origin ${{ github.ref_name }}
            git checkout ${{ github.ref_name }} || git checkout -b ${{ github.ref_name }} origin/${{ github.ref_name }}
            git reset --hard origin/${{ github.ref_name }}
            cd hermes-agent

            echo "--- СОЗДАНИЕ .env ФАЙЛА ---"
            cat > .env << EOF
            TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
            TELEGRAM_PROXY=${{ secrets.TELEGRAM_PROXY }}
            INTERNAL_SECRET=${{ secrets.INTERNAL_SECRET }}
            EOF

            echo "--- СБОРКА И ЗАПУСК ---"
            export DOCKER_BUILDKIT=1
            docker network create tryneuro_network || true
            docker-compose down --remove-orphans
            docker-compose build --no-cache --parallel
            docker-compose up -d

            echo "--- ОЧИСТКА ---"
            docker system prune -f

            echo "--- СТАТУС ---"
            docker-compose ps
