<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Нет соединения — 999 CRM</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #fdf6e3;
            color: #586e75;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .offline-container {
            text-align: center;
            max-width: 400px;
            padding: 40px 20px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        .logo { font-size: 40px; font-weight: 900; color: #268bd2; margin-bottom: 8px; }
        h1 { color: #268bd2; margin-bottom: 16px; font-size: 22px; }
        p { color: #93a1a1; line-height: 1.6; margin-bottom: 24px; font-size: 14px; }
        .btn {
            display: block;
            width: 100%;
            box-sizing: border-box;
            background: #268bd2;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            margin-bottom: 12px;
            text-decoration: none;
        }
        .btn-secondary { background: white; color: #268bd2; border: 2px solid #268bd2; }
    </style>
</head>
<body>
    <div class="offline-container">
        <div class="logo">999</div>
        <h1>Нет соединения</h1>
        <p>999 CRM — приложение для записей, клиентов и расписания. Проверьте интернет и нажмите «Повторить». Политика конфиденциальности встроена в приложение и открывается без интернета.</p>
        <a class="btn" href="https://crm.999crm.ru/">Повторить</a>
        <a class="btn btn-secondary" href="https://crm.999crm.ru/privacy">Политика конфиденциальности</a>
    </div>
</body>
</html>
