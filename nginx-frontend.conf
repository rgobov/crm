# nginx-frontend.conf - Улучшенная версия

server {
    listen 80;
    root /usr/share/nginx/html;

    # Явно указываем, что index.html - главный файл
    index index.html;

    # Это правило для всех запросов
    location / {
        # Сначала Nginx пытается найти точный файл (например, /main.dart.js)
        # Если не находит - он отдает /index.html, чтобы Flutter сам разобрался с маршрутом
        try_files $uri $uri/ /index.html;
    }

    # Дополнительное правило, чтобы браузер правильно кэшировал статические файлы
    location ~* \.(?:ico|css|js|gif|jpe?g|png)$ {
        expires 1y;
        add_header Cache-Control "public";
    }
}
